# The controlled vocabulary for every resource in the studio library (render-node-plan.md section 9.2 and
# library-labels-and-search.md). Every label in a job file must come from here; a job using anything else is refused.
# Each value: a one-line definition and the words people (and screenplays) use for it. Changes are reviewed like code,
# and bump `version`, which is stored on every registered item.

version: 2

kinds:
  plate_3d:
    definition: A rendered 3D shot of the bowling world, with a 20% margin and per-frame data.
    required: [subjects, events, camera_angle, camera_move, shot_size, speed, mood, story_uses, series_fit, energy, rights]
    optional: [lane_zone, pins_state, ball, result, leave, aliases]
  character_action:
    definition: A certified 2D cut-paper action of one cast member from one angle.
    required: [character, action, angle, story_uses, series_fit, energy, rights]
    optional: [loopable, pairs_with, aliases]
  environment_2d:
    definition: A cut-paper set, ready for characters.
    required: [place, framing, mood, story_uses, series_fit, rights]
    optional: [aliases]
  music_bed:
    definition: An owned music bed from the code music engine, fully measured.
    required: [music_mood, arc, energy, story_uses, series_fit, rights]
    optional: [instruments, aliases]
  sfx:
    definition: A sound effect, trimmed, levelled and measured.
    required: [sfx_category, intensity, perspective, rights]
    optional: [story_uses, aliases]
  photo_motion:
    definition: A slow camera move with real depth, made from a still photo.
    required: [photo_subject, era, photo_motion, story_uses, series_fit, rights]
    optional: [person, aliases]
  photo_upscaled:
    definition: A still photo sharpened to at least 1080 pixels on its short side.
    required: [photo_subject, era, rights]
    optional: [person, aliases]
  photo_cutout:
    definition: A still photo with its subject cut out on transparency.
    required: [photo_subject, era, rights]
    optional: [person, aliases]
  footage_shot:
    definition: One shot from our own videos, with its transcript and quality.
    required: [footage_source, shot_size, story_uses, rights]
    optional: [person, aliases]
  catalogue:
    definition: The library's own catalogue and search data.
    required: []
    optional: []

# Rules linking facets: when an item's labels match `when`, the `require` facets must be present.
rules:
  - { when: { facet: events, contains: leave }, require: [leave], reason: an item showing a leave must say which leave }
  - { when: { facet: result, in: [leave, split] }, require: [leave], reason: a leave or split result must say which pins }
  - { when: { facet: pins_state, in: [leave] }, require: [leave], reason: pins left standing must say which pins }

